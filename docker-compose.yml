services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis-service
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  app-blue:
    build: .
    container_name: app-blue
    profiles: ["blue"]
    ports:
      - "5001:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEPLOY_COLOR=blue
      - COMMIT_SHA=${COMMIT_SHA:-unknown}
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

  app-green:
    build: .
    container_name: app-green
    profiles: ["green"]
    ports:
      - "5002:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEPLOY_COLOR=green
      - COMMIT_SHA=${COMMIT_SHA:-unknown}
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy

networks:
  app-net:
    driver: bridge

volumes:
  redis-data:
